name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-web
    steps:
      - uses: actions/checkout@v4
        with:
          repository: parob/homecast-web
          path: app-web

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-web/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  build-mac:
    name: Build Mac App
    # macos-15, not macos-14. This job had been red on main since 19 August with
    # four Swift concurrency errors — BridgeLoad is @MainActor and three call
    # sites in HomecastApp.swift are synchronous — that no local Xcode raises.
    # They were the older image's compiler, not the code: the TestFlight
    # workflow compiles the same commit cleanly on macos-15 and ships it to the
    # store. A permanently red job teaches everyone to ignore CI, and this one
    # is the only thing guarding against iOS-only breakage.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: parob/homecast-web
          path: app-web

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-web/package-lock.json

      - name: Build and bundle web app
        run: |
          cd app-web
          npm ci
          npm run build
          cd ..
          mkdir -p app-ios-macos/Resources/web-dist
          cp -r app-web/dist/* app-ios-macos/Resources/web-dist/

      # Match the release workflow's toolchain, so a build that passes here is
      # a build that can actually ship.
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build Mac Catalyst
        run: |
          cd app-ios-macos
          xcodebuild -project Homecast.xcodeproj \
            -scheme Homecast \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
