# Build a signed Android release and upload it to a Play Store track.
#
# Same reason as the TestFlight workflow: the build should not depend on one
# laptop, and the issue routine has no Android toolchain either. Everything the
# local scripts/play/release.sh does, done on a runner.
name: Play

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "ship" to build and upload to Play'
        required: true
      track:
        description: 'Play track'
        required: false
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      notes:
        description: 'Release notes shown to testers'
        required: false

concurrency:
  # Two concurrent uploads would race for the same version code.
  group: play
  cancel-in-progress: false

jobs:
  build:
    if: github.event.inputs.confirm == 'ship'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app-android-windows-linux

    steps:
      # Only main ships, for the same reason as TestFlight: a build that reaches
      # testers must be code a human already merged. `production` additionally
      # puts it in front of everyone, so it is refused outright here — promoting
      # a track is a human decision, and scripts/play/promote.sh is how.
      - name: Refuse anything but main, and refuse production
        working-directory: .
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Play builds only ship from main. Got ${{ github.ref }}."
            exit 1
          fi
          if [ "${{ inputs.track }}" = "production" ]; then
            echo "::error::This workflow does not ship to production. Upload to a test track, then promote deliberately."
            exit 1
          fi

      - uses: actions/checkout@v4

      # The app wraps the web app, same as the native shells do.
      - uses: actions/checkout@v4
        with:
          repository: parob/homecast-web
          path: app-web

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install the Android NDK
        run: sdkmanager --install "ndk;27.1.12297006"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Restore the upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > src-tauri/gen/android/app/release.keystore
          # build.gradle.kts already carries the alias and passwords.
          test -s src-tauri/gen/android/app/release.keystore

      - name: Write the Play service-account key
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/play"
          printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/play/key.json"
          chmod 600 "$RUNNER_TEMP/play/key.json"

      # The local files lie about this, and the project's own release notes say
      # so: gen/android/tauri.properties is not regenerated by a normal build and
      # has sat a full version behind what Play was serving. The version code
      # must exceed every code on EVERY track, so ask Play rather than the repo.
      - name: Work out the next version code
        id: version_code
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r scripts/play/requirements.txt
          NEXT=$("$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import os, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          c = service_account.Credentials.from_service_account_file(
              os.path.join(os.environ["RUNNER_TEMP"], "play", "key.json"),
              scopes=["https://www.googleapis.com/auth/androidpublisher"])
          c.refresh(Request())
          H = {"Authorization": f"Bearer {c.token}"}
          B = ("https://androidpublisher.googleapis.com/androidpublisher/v3"
               "/applications/cloud.homecast.app")
          eid = requests.post(f"{B}/edits", headers=H, json={}).json()["id"]
          codes = [int(code)
                   for t in requests.get(f"{B}/edits/{eid}/tracks", headers=H).json().get("tracks", [])
                   for r in t.get("releases", [])
                   for code in (r.get("versionCodes") or [])]
          requests.delete(f"{B}/edits/{eid}", headers=H)
          print(max(codes, default=0) + 1)
          PY
          )
          echo "next=$NEXT" >> $GITHUB_OUTPUT
          echo "Highest version code on any track + 1 = $NEXT"

      - name: Pin the version code for this build
        run: |
          set -euo pipefail
          PROPS=src-tauri/gen/android/tauri.properties
          # Written, not committed — same reasoning as the iOS build number.
          # tauri reads this file at build time, so it has to exist on disk, but
          # nothing is gained by carrying the churn in git.
          sed -i "s/^tauri.android.versionCode=.*/tauri.android.versionCode=${{ steps.version_code.outputs.next }}/" "$PROPS"
          grep '^tauri.android.version' "$PROPS"

      - name: Build the web app and the AAB
        run: |
          set -euo pipefail
          (cd ../app-web && npm ci && npm run build)
          npm ci
          npx tauri android build --aab

      - name: Upload to Play
        env:
          PLAY_TRACK: ${{ inputs.track }}
          PLAY_NOTES: ${{ github.event.inputs.notes }}
        run: |
          set -euo pipefail
          AAB=src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
          test -f "$AAB" || { echo "::error::AAB missing at $AAB"; exit 1; }
          "$RUNNER_TEMP/venv/bin/python" scripts/play/upload.py \
            --json-key "$RUNNER_TEMP/play/key.json" \
            --package cloud.homecast.app \
            --aab "$AAB" \
            --track "$PLAY_TRACK" \
            ${PLAY_NOTES:+--release-notes "$PLAY_NOTES"}

      - name: Summary
        if: always()
        working-directory: .
        run: |
          {
            echo "### Play"
            echo
            echo "- version code: \`${{ steps.version_code.outputs.next }}\`"
            echo "- track: \`${{ inputs.track }}\`"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- notes: ${{ github.event.inputs.notes || '_none_' }}"
          } >> $GITHUB_STEP_SUMMARY
