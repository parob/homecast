# Build a signed Android release and upload it to a Play Store track.
#
# Same reason as the TestFlight workflow: the build should not depend on one
# laptop, and the issue routine has no Android toolchain either. Everything the
# local scripts/play/release.sh does, done on a runner.
#
# Two ways in, same as TestFlight. `workflow_dispatch` for a person with `gh`;
# `repository_dispatch` for the issue routine, whose GitHub App token has
# Contents: write but not the Actions: write that `gh workflow run` needs:
#
#   gh api repos/parob/homecast/dispatches --input - <<'JSON'
#   {"event_type":"play","client_payload":{"confirm":"ship","track":"internal","notes":"why"}}
#   JSON
#   gh run list --workflow play.yml --event repository_dispatch --limit 1
#
# A dispatch event runs on the default branch, so the main-only guard holds for
# it by construction; `confirm` and `track` are checked the same way either way.
name: Play

on:
  repository_dispatch:
    types: [play]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "ship" to build and upload to Play'
        required: true
      track:
        description: 'Play track'
        required: false
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      notes:
        description: 'Release notes shown to testers'
        required: false

concurrency:
  # Two concurrent uploads would race for the same version code.
  group: play
  cancel-in-progress: false

jobs:
  build:
    if: github.event.inputs.confirm == 'ship' || github.event.client_payload.confirm == 'ship'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # `inputs.*` is empty on a repository_dispatch, so every step reads these
      # rather than the event it happened to arrive on.
      TRACK: ${{ github.event.inputs.track || github.event.client_payload.track || 'internal' }}
      NOTES: ${{ github.event.inputs.notes || github.event.client_payload.notes || '' }}
    defaults:
      run:
        working-directory: app-android-windows-linux

    steps:
      # Only main ships, for the same reason as TestFlight: a build that reaches
      # testers must be code a human already merged. `production` additionally
      # puts it in front of everyone, so it is refused outright here — promoting
      # a track is a human decision, and scripts/play/promote.sh is how.
      - name: Refuse anything but main, and refuse production
        working-directory: .
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Play builds only ship from main. Got ${{ github.ref }}."
            exit 1
          fi
          case "$TRACK" in
            internal|alpha|beta) ;;
            production)
              echo "::error::This workflow does not ship to production. Upload to a test track, then promote deliberately."
              exit 1 ;;
            *) echo "::error::track must be internal, alpha or beta. Got '$TRACK'."; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      # The app wraps the web app, same as the native shells do.
      - uses: actions/checkout@v4
        with:
          repository: parob/homecast-web
          path: app-web

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install the Android NDK
        run: sdkmanager --install "ndk;27.1.12297006"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Restore the upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > src-tauri/gen/android/app/release.keystore
          # build.gradle.kts already carries the alias and passwords.
          test -s src-tauri/gen/android/app/release.keystore

      - name: Write the Play service-account key
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/play"
          printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/play/key.json"
          chmod 600 "$RUNNER_TEMP/play/key.json"

      # The local files lie about this, and the project's own release notes say
      # so: gen/android/tauri.properties is not regenerated by a normal build and
      # has sat a full version behind what Play was serving. The version code
      # must exceed every code on EVERY track, so ask Play rather than the repo.
      - name: Work out the next version code
        id: version_code
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r scripts/play/requirements.txt
          NEXT=$("$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import os, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          c = service_account.Credentials.from_service_account_file(
              os.path.join(os.environ["RUNNER_TEMP"], "play", "key.json"),
              scopes=["https://www.googleapis.com/auth/androidpublisher"])
          c.refresh(Request())
          H = {"Authorization": f"Bearer {c.token}"}
          B = ("https://androidpublisher.googleapis.com/androidpublisher/v3"
               "/applications/cloud.homecast.app")
          eid = requests.post(f"{B}/edits", headers=H, json={}).json()["id"]
          codes = [int(code)
                   for t in requests.get(f"{B}/edits/{eid}/tracks", headers=H).json().get("tracks", [])
                   for r in t.get("releases", [])
                   for code in (r.get("versionCodes") or [])]
          requests.delete(f"{B}/edits/{eid}", headers=H)
          print(max(codes, default=0) + 1)
          PY
          )
          echo "next=$NEXT" >> $GITHUB_OUTPUT
          echo "Highest version code on any track + 1 = $NEXT"

      # Written into tauri.conf.json, NOT gen/android/tauri.properties.
      #
      # `tauri android build` regenerates tauri.properties from tauri.conf.json
      # before it calls gradle, so writing the properties file first accomplishes
      # nothing — the value is silently replaced and the AAB ships with whatever
      # the conf says. That is exactly what happened: the log showed
      # versionCode=1001004 pinned, and Play answered
      #
      #   Version code 1001003 has already been used.
      #
      # Tauri derives the code from the semver as major*1000000 + minor*1000 +
      # patch, so the version STRING is the only real input. Decode the next
      # free code back into a version and set that.
      - name: Set the version for this build
        run: |
          set -euo pipefail
          python3 - "${{ steps.version_code.outputs.next }}" <<'PY'
          import json, sys, pathlib
          code = int(sys.argv[1])
          major, rest = divmod(code, 1_000_000)
          minor, patch = divmod(rest, 1_000)
          version = f"{major}.{minor}.{patch}"

          for path, key in (("src-tauri/tauri.conf.json", "version"),
                            ("package.json", "version")):
              f = pathlib.Path(path)
              d = json.loads(f.read_text())
              d[key] = version
              f.write_text(json.dumps(d, indent=2) + "\n")
          print(f"version {version} -> versionCode {code}")
          PY

      - name: Build the web app and the AAB
        run: |
          set -euo pipefail
          (cd ../app-web && npm ci && npm run build)
          npm ci
          npx tauri android build --aab

      - name: Upload to Play
        env:
          PLAY_TRACK: ${{ env.TRACK }}
          PLAY_NOTES: ${{ env.NOTES }}
        run: |
          set -euo pipefail
          AAB=src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
          test -f "$AAB" || { echo "::error::AAB missing at $AAB"; exit 1; }
          "$RUNNER_TEMP/venv/bin/python" scripts/play/upload.py \
            --json-key "$RUNNER_TEMP/play/key.json" \
            --package cloud.homecast.app \
            --aab "$AAB" \
            --track "$PLAY_TRACK" \
            ${PLAY_NOTES:+--release-notes "$PLAY_NOTES"}

      - name: Summary
        if: always()
        working-directory: .
        run: |
          {
            echo "### Play"
            echo
            echo "- version code: \`${{ steps.version_code.outputs.next }}\`"
            echo "- track: \`${{ env.TRACK }}\`"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- trigger: ${{ github.event_name }}"
            echo "- notes: ${{ env.NOTES || '_none_' }}"
          } >> $GITHUB_STEP_SUMMARY
