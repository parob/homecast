# Build the iOS app and upload it to TestFlight.
#
# This exists so the build is not tied to one laptop. The issue routine runs on
# Linux and cannot compile an iOS app at all — no Xcode — so the only way it can
# ship one is to ask a macOS runner to do it. A human can run it the same way.
#
# Signing uses the App Store Connect API key, not an exported .p12. Xcode fetches
# or creates the distribution certificate and profile on the runner
# (-allowProvisioningUpdates), so there is no certificate to export, rotate, or
# leak into a secret.
#
# Three ways in, same job, all funnelled through the `gate` job below.
#
#   1. `workflow_dispatch` — a person with `gh` and the `workflow` scope.
#   2. `push` to main touching `.github/ship/testflight.json` — the ship file.
#      This is the one the issue routine can actually reach. See below.
#   3. `repository_dispatch` — kept for anything holding a token that can POST
#      to /dispatches. The issue routine CANNOT: see below.
#
# Why the ship file exists. The routine acts through a GitHub App token with
# Contents: write but not Actions: write, so `gh workflow run` answers
# "403 Resource not accessible by integration". `repository_dispatch` was added
# for it on the theory that creating a dispatch event needs only Contents:
# write — true of the token, and beside the point: the routine has no route to
# api.github.com at all. Every call it makes goes through the GitHub MCP
# server, which exposes no repository-dispatch tool, and a direct request is
# refused before it reaches GitHub:
#
#   $ curl https://api.github.com/repos/parob/homecast
#   403 {"message":"GitHub access is not enabled for this session."}
#
# So neither dispatch trigger is reachable, whatever the token holds. The only
# write primitive the routine actually has is a git push. Hence a trigger a
# push can pull: it opens a PR that edits the ship file, and merging that PR
# starts the build.
#
# ⚠️  Merging a PR that touches .github/ship/testflight.json ships a build to
#     TestFlight. That is the whole point of the file, but it means the file is
#     not somewhere to leave half-finished edits.
#
# The human stays in the loop by construction: the routine can only *request* a
# ship, and a merge is what grants it. Deliberately not a `ship/**` branch
# trigger, which would need no merge — GitHub runs the workflow file from the
# ref that triggered it, so a pushed branch would control the workflow that
# uploads to Apple, and unreviewed code could ship. Trigger on main and the
# workflow is always main's reviewed copy.
#
# A dispatch event always runs on the default branch, so the main-only guard
# holds for it by construction; `confirm` and `platforms` are validated the
# same way whichever door they arrive through, because a payload — or a file on
# a branch — can say anything.
name: TestFlight

on:
  push:
    branches: [main]
    paths: ['.github/ship/testflight.json']
  repository_dispatch:
    types: [testflight]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "ship" to build and upload to TestFlight'
        required: true
      notes:
        description: 'What changed (recorded in the run summary)'
        required: false
      platforms:
        description: 'Which apps to ship'
        required: false
        default: both
        type: choice
        options: [both, ios, mac]

concurrency:
  # Two concurrent uploads would race for the same build number.
  group: testflight
  cancel-in-progress: false

jobs:
  # Work out whether to ship, and on what, before booking a macOS runner.
  #
  # The three doors carry their arguments in three different places — form
  # inputs, a dispatch payload, a file in the tree — and `inputs.*` is empty on
  # everything but the form. One cheap Linux job reads whichever applies and
  # hands the build a single answer, so no step below has to know which door it
  # came through.
  #
  # Everything read here is untrusted: a payload can say anything, and so can a
  # file on a branch someone opened a PR from. `confirm` and `platforms` are
  # validated the same way in every case, and values reach the script as env
  # vars rather than `${{ }}` interpolation — `notes` is free text, and
  # interpolating it into a shell script would run whatever it contained.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.decide.outputs.go }}
      platforms: ${{ steps.decide.outputs.platforms }}
      notes: ${{ steps.decide.outputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether this is a ship
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          IN_CONFIRM: ${{ github.event.inputs.confirm }}
          IN_PLATFORMS: ${{ github.event.inputs.platforms }}
          IN_NOTES: ${{ github.event.inputs.notes }}
          CP_CONFIRM: ${{ github.event.client_payload.confirm }}
          CP_PLATFORMS: ${{ github.event.client_payload.platforms }}
          CP_NOTES: ${{ github.event.client_payload.notes }}
        run: |
          set -euo pipefail
          SHIP_FILE=.github/ship/testflight.json

          case "$EVENT" in
            workflow_dispatch)
              CONFIRM="${IN_CONFIRM:-}"
              PLATFORMS="${IN_PLATFORMS:-both}"
              NOTES="${IN_NOTES:-}"
              ;;
            repository_dispatch)
              CONFIRM="${CP_CONFIRM:-}"
              PLATFORMS="${CP_PLATFORMS:-both}"
              NOTES="${CP_NOTES:-}"
              ;;
            push)
              if [ ! -f "$SHIP_FILE" ]; then
                echo "::notice::$SHIP_FILE is gone — nothing to ship."
                echo "go=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # `// empty` so a null or absent key reads as "", not "null".
              CONFIRM=$(jq -r '.confirm // empty' "$SHIP_FILE")
              PLATFORMS=$(jq -r '.platforms // "both"' "$SHIP_FILE")
              NOTES=$(jq -r '.notes // empty' "$SHIP_FILE")
              ;;
            *)
              echo "::error::Unexpected event '$EVENT'."
              exit 1
              ;;
          esac

          # Not a ship is a clean no-op, not a failure: the ship file lives in
          # the tree permanently, and setting confirm to anything else is how it
          # is disarmed. Editing it for any other reason must not go red.
          if [ "$CONFIRM" != "ship" ]; then
            echo "::notice::confirm is '$CONFIRM', not 'ship' — not building."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A typo here, though, is loud. Someone asked for a ship and would
          # otherwise be left waiting on a build that silently never ran.
          case "$PLATFORMS" in
            both|ios|mac) ;;
            *) echo "::error::platforms must be both, ios or mac. Got '$PLATFORMS'."; exit 1 ;;
          esac

          # Flattened: a newline would end the value early and the rest would be
          # read as further output lines.
          NOTES=$(printf '%s' "$NOTES" | tr '\n\r' '  ')

          {
            echo "go=true"
            echo "platforms=$PLATFORMS"
            echo "notes=$NOTES"
          } >> "$GITHUB_OUTPUT"
          echo "Shipping $PLATFORMS (via $EVENT)."

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Whichever door this arrived through, `gate` has already resolved and
      # validated both of these.
      PLATFORMS: ${{ needs.gate.outputs.platforms }}
      NOTES: ${{ needs.gate.outputs.notes }}

    steps:
      # Only main ships. The issue routine is allowed to run this, and a build
      # that reaches testers must be code a human has already reviewed and
      # merged — not a branch the routine opened five minutes ago. Checked here
      # rather than trusted, because workflow_dispatch takes any ref.
      - name: Refuse to ship anything but main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::TestFlight builds only ship from main. Got $REF."
            exit 1
          fi

      - uses: actions/checkout@v4

      # The app bundles the web app for Community mode. Built from homecast-web
      # main, the same source the cloud site serves.
      - uses: actions/checkout@v4
        with:
          repository: parob/homecast-web
          path: app-web

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-web/package-lock.json

      - name: Bundle the web app
        run: |
          set -euo pipefail
          cd app-web && npm ci && npm run build && cd ..
          rm -rf app-ios-macos/Resources/web-dist
          cp -r app-web/dist app-ios-macos/Resources/web-dist

      - name: Select the newest Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Write the App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          chmod 600 ~/private_keys/*.p8

      # Never trust the number in project.pbxproj — it drifts, and both stores
      # reject a build that does not exceed everything previously uploaded. Ask
      # App Store Connect what the highest is, across BOTH platforms, since they
      # share one numbering train.
      - name: Work out the next build number
        id: build_number
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # A venv, not `pip install`: the runner's Python is externally
          # managed (PEP 668) and a bare install exits 1.
          python3 -m venv "$RUNNER_TEMP/ascvenv"
          "$RUNNER_TEMP/ascvenv/bin/pip" install --quiet pyjwt cryptography
          NEXT=$("$RUNNER_TEMP/ascvenv/bin/python" - <<'PY'
          import json, os, time, urllib.request, jwt
          kid, iss = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"]
          key = open(os.path.expanduser(f"~/private_keys/AuthKey_{kid}.p8")).read()
          now = int(time.time())
          tok = jwt.encode({"iss": iss, "iat": now, "exp": now + 900,
                            "aud": "appstoreconnect-v1"}, key,
                           algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          url = ("https://api.appstoreconnect.apple.com/v1/builds"
                 "?filter[app]=6759559232&sort=-uploadedDate&limit=50")
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {tok}"})
          builds = json.load(urllib.request.urlopen(req))["data"]
          highest = max((int(b["attributes"]["version"]) for b in builds
                         if b["attributes"]["version"].isdigit()), default=0)
          print(highest + 1)
          PY
          )
          echo "next=$NEXT" >> $GITHUB_OUTPUT
          echo "Highest uploaded build + 1 = $NEXT"

      - name: Archive (iOS)
        if: env.PLATFORMS != 'mac'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        working-directory: app-ios-macos
        run: |
          set -euo pipefail
          # Archived UNSIGNED, signed at export.
          #
          # A signed archive wants a *development* certificate — that is what
          # Xcode picks for the build step under automatic signing, and it is
          # what a laptop already has sitting in its keychain. A fresh runner
          # has none, so Xcode tries to create one and hits Apple's per-account
          # certificate cap:
          #
          #   error: Your account has reached the maximum number of
          #   certificates. To create a new one, you must choose one to revoke.
          #
          # Nothing about an App Store build needs that certificate. Export is
          # where distribution signing actually happens, so skip it here and let
          # the export step below do the one signing that matters. It also means
          # this workflow never adds a certificate to the account, however many
          # times it runs.
          #
          # CURRENT_PROJECT_VERSION is passed as a build setting rather than
          # committed. It applies to every target at once, which is what the
          # stores require — an app-extension version that does not match the
          # app gets the upload rejected — and it leaves no version churn in git.
          xcodebuild archive \
            -project Homecast.xcodeproj \
            -scheme Homecast \
            -destination 'generic/platform=iOS' \
            -archivePath build/Homecast-ios.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ steps.build_number.outputs.next }}

      - name: Export (iOS)
        if: env.PLATFORMS != 'mac'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        working-directory: app-ios-macos
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath build/Homecast-ios.xcarchive \
            -exportPath build/export-ios \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight (iOS)
        if: env.PLATFORMS != 'mac'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        working-directory: app-ios-macos
        run: |
          set -euo pipefail
          export API_PRIVATE_KEYS_DIR=~/private_keys
          # altool exits 0 even when it prints "UPLOAD FAILED", so its exit code
          # is not the answer. It once reported a green step for a Mac build
          # Apple had rejected outright, and the only way to notice was to go
          # and look at App Store Connect. Check the words, not the status.
          set +e
          xcrun altool --upload-app -t ios \
            -f build/export-ios/Homecast.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool-ios.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] || ! grep -q "UPLOAD SUCCEEDED" "$RUNNER_TEMP/altool-ios.log"; then
            echo "::error::altool did not report UPLOAD SUCCEEDED for ios (exit $status)"
            exit 1
          fi

      # Mac Catalyst, after iOS and never alongside it. Concurrent xcodebuild
      # archive runs share DerivedData and corrupt each other's intermediates —
      # the project's own release notes say to do these one at a time, and a
      # single job running steps in order is what enforces it.
      #
      # Same build number as the iOS leg on purpose: the two platforms share one
      # numbering train in App Store Connect, and shipping them as a matched
      # pair is what makes "build 54" mean one thing.
      # Signed, unlike the iOS leg above. Entitlements are embedded at signing
      # time, so an unsigned Mac archive carries none — and the Mac App Store
      # requires com.apple.security.app-sandbox, which the project declares but
      # which never reached the package:
      #
      #   Validation failed (409) App sandbox not enabled.
      #
      # iOS gets away with it because export re-applies entitlements from the
      # provisioning profile. The Mac package carries its own, so it cannot.
      - name: Archive (Mac Catalyst)
        if: env.PLATFORMS != 'ios'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        working-directory: app-ios-macos
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Homecast.xcodeproj \
            -scheme Homecast \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -archivePath build/Homecast-mac.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ steps.build_number.outputs.next }}

      - name: Export (Mac Catalyst)
        if: env.PLATFORMS != 'ios'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        working-directory: app-ios-macos
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath build/Homecast-mac.xcarchive \
            -exportPath build/export-mac \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight (Mac Catalyst)
        if: env.PLATFORMS != 'ios'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        working-directory: app-ios-macos
        run: |
          set -euo pipefail
          export API_PRIVATE_KEYS_DIR=~/private_keys
          # altool exits 0 even when it prints "UPLOAD FAILED", so its exit code
          # is not the answer. It once reported a green step for a Mac build
          # Apple had rejected outright, and the only way to notice was to go
          # and look at App Store Connect. Check the words, not the status.
          set +e
          xcrun altool --upload-app -t macos \
            -f build/export-mac/Homecast.pkg \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool-mac.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] || ! grep -q "UPLOAD SUCCEEDED" "$RUNNER_TEMP/altool-mac.log"; then
            echo "::error::altool did not report UPLOAD SUCCEEDED for mac (exit $status)"
            exit 1
          fi

      # Give back the certificate this run created.
      #
      # A fresh runner has an empty keychain, so signing the Mac archive makes
      # Xcode mint a new development certificate every time. That is precisely
      # how the account reached Apple's cap: eleven certificates, ten of them
      # named "Created via API", which had to be revoked by hand before this
      # workflow could sign anything at all. Left alone it would refill the cap
      # in about ten builds and break itself again.
      #
      # Only ever the API-created ones: a human's certificate is named after
      # them, and revoking that would break their laptop. `concurrency` above
      # keeps runs serial, so this cannot revoke a certificate another run is
      # still using.
      - name: Revoke the certificate this run created
        if: always() && env.PLATFORMS != 'ios'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ascvenv/bin/python" - <<'PY'
          import json, os, time, urllib.request, urllib.error, jwt
          kid, iss = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"]
          key = open(os.path.expanduser(f"~/private_keys/AuthKey_{kid}.p8")).read()

          def token():
              now = int(time.time())
              return jwt.encode({"iss": iss, "iat": now, "exp": now + 900,
                                 "aud": "appstoreconnect-v1"}, key,
                                algorithm="ES256", headers={"kid": kid, "typ": "JWT"})

          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/certificates?limit=200",
              headers={"Authorization": f"Bearer {token()}"})
          certs = json.load(urllib.request.urlopen(req))["data"]
          doomed = [c for c in certs
                    if c["attributes"]["certificateType"] == "DEVELOPMENT"
                    and c["attributes"].get("displayName") == "Created via API"]
          for c in doomed:
              r = urllib.request.Request(
                  f"https://api.appstoreconnect.apple.com/v1/certificates/{c['id']}",
                  headers={"Authorization": f"Bearer {token()}"}, method="DELETE")
              try:
                  urllib.request.urlopen(r)
                  print(f"revoked {c['id']}")
              except urllib.error.HTTPError as e:
                  print(f"could not revoke {c['id']}: {e.code}")
          print(f"{len(doomed)} API-created development certificate(s) revoked")
          PY

      - name: Summary
        if: always()
        run: |
          # $NOTES, not ${{ env.NOTES }}: it is free text from a form, a payload
          # or a file, and interpolating it into the script would run it.
          {
            echo "### TestFlight"
            echo
            echo "- build: \`${{ steps.build_number.outputs.next }}\`"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- platforms: $PLATFORMS"
            echo "- trigger: ${{ github.event_name }}"
            echo "- notes: ${NOTES:-_none_}"
          } >> $GITHUB_STEP_SUMMARY
